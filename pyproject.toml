[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cve-matcher"
version = "0.1.0"
description = "Offline CVE/vulnerability matching against a CycloneDX SBOM or npm/pip manifest, using a local OSV-schema export."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KhanSaahib" }]
dependencies = []
keywords = ["osv", "cve", "sbom", "cyclonedx", "vulnerability-scanner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/KhanSaahib/cve-matcher"
Issues = "https://github.com/KhanSaahib/cve-matcher/issues"
Source = "https://github.com/KhanSaahib/cve-matcher"

[project.scripts]
cve-matcher = "cve_matcher.__main__:main"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["cve_matcher*"]
